<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yulu Telecaller Dashboard</title>
<link rel="icon" type="image/png" href="img/yulu-mark.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">

  <!-- ============ LEFT SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="img/yulu-mark.png" alt="Yulu">
      <div class="brand-text">
        <img class="brand-word" src="img/yulu-wordmark.png" alt="yulu">
        <div class="brand-sub">Telecalling · Live performance</div>
      </div>
    </div>
    <nav class="nav" id="tabNav"></nav>
    <div class="sidebar-bottom">
      <div id="roleBadgeWrap"></div>
      <div class="upload-controls" id="uploadControls"></div>
    </div>
  </aside>

  <!-- ============ MAIN AREA ============ -->
  <main class="main">
    <header class="pagebar">
      <div class="pagebar-left">
        <h1 id="pageTitle">Overview</h1>
        <div class="range-summary" id="rangeSummary"></div>
      </div>
      <div class="pagebar-right" id="filterControls"></div>
    </header>
    <div class="coverage" id="coverage"></div>
    <div id="app"></div>
    <div class="footer-note">Aggregates are visible to everyone · row-level detail and uploads are for editors only</div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<!-- Core -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/router.js"></script>
<script src="js/coverage.js"></script>
<script src="js/aggregation.js"></script>
<!-- Pages, in sidebar order -->
<script src="js/tab-overview.js"></script>
<script src="js/tab-campaigns.js"></script>
<script src="js/tab-agents.js"></script>
<script src="js/tab-insights.js"></script>
<script src="js/tab-flags.js"></script>
<script src="js/tab-conversion.js"></script>
<!-- Uploads -->
<script src="js/upload-calls.js"></script>
<script src="js/upload-conversion.js"></script>
<script src="js/main.js"></script>
</body>
</html>
